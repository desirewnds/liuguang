[package]
license.workspace = true
repository.workspace = true
name = "flow-platform"
version = "2.0.0"
edition = "2021"

[features]
default = []
desktop = ["dep:rfd", "dep:tray-icon", "dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-user-notifications", "dep:block2", "dep:dispatch2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.18", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }
objc2 = { version = "0.6.5", optional = true }
block2 = { version = "0.6.2", optional = true }
dispatch2 = { version = "0.3.1", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSScreen", "NSWindow"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "block2"], optional = true }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "block2"], optional = true }
