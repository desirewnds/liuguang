[package]
license.workspace = true
repository.workspace = true
name = "flow-gui"
version = "2.0.0"
edition = "2021"
default-run = "flow-desktop"

[[bin]]
name = "flow-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:iced", "dep:image-codec", "dep:reqwest", "dep:flow-app", "dep:flow-platform", "dep:tokio", "dep:uuid"]

[dependencies]
iced = { version = "=0.14.0", optional = true, default-features = false, features = ["wgpu", "tiny-skia", "tokio", "advanced", "image-without-codecs"] }
image-codec = { package = "image", version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["native-tls", "socks"] }
flow-app = { path = "../flow-app", optional = true }
flow-platform = { path = "../flow-platform", optional = true }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["sync", "time", "rt-multi-thread"] }
uuid = { version = "1", optional = true, features = ["v4"] }

