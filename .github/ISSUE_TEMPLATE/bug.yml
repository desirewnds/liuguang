name: 问题报告
description: 报告可重复的桌面版问题
body:
  - type: input
    id: versions
    attributes:
      label: 应用、yt-dlp、操作系统版本及芯片架构
      description: Mac 请注明 Apple Silicon 或 Intel；Windows 请注明系统版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明下载范围、画质、格式，以及需要的高级设置。只提供可公开的链接。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望结果和实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已检查并移除凭据的日志
      description: 不包含 Cookies、密码、认证请求头、私人下载地址或个人配置文件。
      render: text
